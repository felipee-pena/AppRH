name: Frontend CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"

    paths:
      - "AppRH_fs/apprh-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
      - "release/**"

    paths:
      - "AppRH_fs/apprh-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    name: Frontend Build and Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppRH_fs/apprh-frontend

    env:
      VITE_API_URL: http://localhost:8081
      VITE_ACCESS_TOKEN_KEY: apprh.access_token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: AppRH_fs/apprh-frontend/package-lock.json

      - name: Display environment versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-${{ github.run_number }}
          path: AppRH_fs/apprh-frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-${{ github.run_number }}
          path: AppRH_fs/apprh-frontend/dist
          if-no-files-found: error
          retention-days: 14