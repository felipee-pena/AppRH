name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "AppRH_fs/apprh-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "AppRH_fs/apprh-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AppRH_fs/apprh-frontend

jobs:
  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      VITE_API_URL: http://localhost:8081
      VITE_ACCESS_TOKEN_KEY: apprh.ci.access-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AppRH_fs/apprh-frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_number }}
          path: AppRH_fs/apprh-frontend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend production bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_number }}
          path: AppRH_fs/apprh-frontend/dist
          if-no-files-found: error
          retention-days: 14
