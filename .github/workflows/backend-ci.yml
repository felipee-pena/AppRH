name: Backend CI

on:
  push:
    paths:
      - "AppRH/AppRH/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "AppRH/AppRH/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: apprh_ci
          POSTGRES_USER: apprh_ci
          POSTGRES_PASSWORD: apprh_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U apprh_ci -d apprh_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORTA: "8081"

      DB_URL: jdbc:postgresql://localhost:5432/apprh_ci
      DB_USER: apprh_ci
      DB_PASSWORD: apprh_ci_password

      secret: ci-secret-with-at-least-32-characters

      FRONTEND_URL: http://localhost:5173

      MAIL_HOST: localhost
      MAIL_PORT: "2525"
      MAIL_USERNAME: ci-test
      MAIL_PASSWORD: ci-test
      MAIL_FROM: no-reply@apprh.test
      MAIL_TEST_RECIPIENT: ""

      SPRING_MAIL_TEST_CONNECTION: "false"

    defaults:
      run:
        working-directory: AppRH/AppRH

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
          cache-dependency-path: AppRH/AppRH/pom.xml

      - name: Grant permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Display environment versions
        run: |
          java -version
          ./mvnw -version
          docker version

      - name: Run Maven verify
        run: ./mvnw --batch-mode clean verify

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-${{ github.run_number }}
          path: AppRH/AppRH/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-${{ github.run_number }}
          path: AppRH/AppRH/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  sonar:
    name: Sonar Quality Gate
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main'
      || github.base_ref == 'main'

    needs:
      - build-test

    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: apprh_sonar
          POSTGRES_USER: apprh_sonar
          POSTGRES_PASSWORD: apprh_sonar_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U apprh_sonar -d apprh_sonar"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORTA: "8081"

      DB_URL: jdbc:postgresql://localhost:5432/apprh_sonar
      DB_USER: apprh_sonar
      DB_PASSWORD: apprh_sonar_password

      secret: sonar-test-secret-with-at-least-32-characters

      FRONTEND_URL: http://localhost:5173

      MAIL_HOST: localhost
      MAIL_PORT: "2525"
      MAIL_USERNAME: sonar-test
      MAIL_PASSWORD: sonar-test
      MAIL_FROM: no-reply@apprh.test
      MAIL_TEST_RECIPIENT: ""

      SPRING_MAIL_TEST_CONNECTION: "false"

    defaults:
      run:
        working-directory: AppRH/AppRH

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
          cache-dependency-path: AppRH/AppRH/pom.xml

      - name: Grant permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests and SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          ./mvnw
          --batch-mode
          clean
          verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.projectKey=${SONAR_PROJECT_KEY}
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.junit.reportPaths=target/surefire-reports
          -Dsonar.qualitygate.wait=true